<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editor de templates — slot de cara</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0F1115;
    --surface:#171A21;
    --surface-2:#1D2128;
    --border:#2A2E38;
    --text:#F5F5F7;
    --dim:#8B8A99;
    --accent:#8B5CF6;
    --danger:#F87171;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;}
  h1{font-size:15px;font-weight:600;margin:0;color:var(--text);}
  .hint{font-size:12px;color:var(--dim);}

  .toolbar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);
  }
  .toolbar .spacer{flex:1;}
  button, .file-btn{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer;
  }
  button:hover, .file-btn:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  button.danger{background:transparent;border-color:var(--danger);color:var(--danger);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  input[type="file"]{display:none;}
  #status{font-size:12px;color:var(--dim);}

  .layout{display:flex;height:calc(100vh - 49px);}
  .stage-col{flex:1;display:flex;flex-direction:column;min-width:0;background:#000;}
  .stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .stage-inner{position:relative;max-width:100%;max-height:100%;}
  video{display:block;max-width:100%;max-height:calc(100vh - 140px);}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;cursor:crosshair;}
  .empty-hint{color:var(--dim);font-size:14px;padding:2rem;text-align:center;}

  .transport{
    display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--border);
  }
  .transport input[type="range"]{flex:1;}
  .transport .time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);min-width:90px;text-align:right;}

  .sidebar{width:320px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  .sidebar-section{padding:14px 16px;border-bottom:1px solid var(--border);}
  .sidebar-section h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);margin:0 0 10px 0;}
  .field{margin-bottom:10px;}
  .field label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:4px;}
  .field input[type="range"]{width:100%;}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--dim);margin-top:8px;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .swatch{width:10px;height:10px;border-radius:50%;display:inline-block;}

  .keyframes{flex:1;overflow-y:auto;padding:8px;}
  .kf-row{
    display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:12px;
  }
  .kf-row:hover{background:var(--surface-2);}
  .kf-row.active{background:rgba(139,92,246,0.18);border:1px solid var(--accent);}
  .kf-row .t{font-variant-numeric:tabular-nums;color:var(--text);flex:1;}
  .kf-row button{padding:2px 7px;font-size:11px;}
  .kf-empty{color:var(--dim);font-size:12px;padding:12px 8px;}
</style>
</head>
<body>

<div class="toolbar">
  <h1>Editor de templates — slot de cara</h1>
  <span class="hint">marcá a mano dónde va el óvalo en cada momento del video</span>
  <div class="spacer"></div>
  <label class="file-btn">Cargar video<input type="file" id="videoFile" accept="video/*"></label>
  <label class="file-btn">Cargar transform.json<input type="file" id="jsonFile" accept="application/json"></label>
  <label class="hint">fps (informativo) <input type="number" id="fpsInput" value="30" min="1" max="240" style="width:52px"></label>
  <button class="primary" id="exportBtn" disabled>Descargar transform.json</button>
  <span id="status"></span>
</div>

<div class="layout">
  <div class="stage-col">
    <div class="stage" id="stage">
      <div class="empty-hint" id="emptyHint">Cargá un video para empezar.</div>
      <div class="stage-inner" id="stageInner" style="display:none">
        <video id="video" muted playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
    </div>
    <div class="transport">
      <button id="playBtn" disabled>▶</button>
      <button id="stepBackBtn" disabled title="Un frame atrás (~1/30s)">⏮</button>
      <button id="stepFwdBtn" disabled title="Un frame adelante (~1/30s)">⏭</button>
      <input type="range" id="seek" min="0" max="1" step="0.001" value="0" disabled>
      <span class="time" id="timeLabel">0.00s / 0.00s</span>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-section">
      <h2>Óvalo actual</h2>
      <div class="field">
        <label><span>Escala</span><span id="scaleVal">0.120</span></label>
        <input type="range" id="scaleRange" min="0.02" max="0.4" step="0.001" value="0.12" disabled>
      </div>
      <div class="field">
        <label><span>Ángulo</span><span id="angleVal">0°</span></label>
        <input type="range" id="angleRange" min="-60" max="60" step="1" value="0" disabled>
      </div>
      <div class="hint">Click en el video para mover el centro del óvalo.</div>
      <div class="legend">
        <span><span class="swatch" style="background:#8B5CF6"></span> editable (sin guardar)</span>
        <span><span class="swatch" style="background:#4ADE80"></span> curva ya guardada</span>
      </div>
      <button class="primary" id="addKeyframeBtn" style="width:100%;margin-top:12px" disabled>+ Keyframe en este momento</button>
    </div>
    <div class="sidebar-section" style="border-bottom:none;flex:1;display:flex;flex-direction:column;min-height:0;">
      <h2>Keyframes</h2>
      <div class="keyframes" id="keyframeList">
        <div class="kf-empty">Todavía no hay ninguno.</div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const stageInner = document.getElementById('stageInner');
const emptyHint = document.getElementById('emptyHint');
const status = document.getElementById('status');

const videoFileInput = document.getElementById('videoFile');
const jsonFileInput = document.getElementById('jsonFile');
const fpsInput = document.getElementById('fpsInput');
const exportBtn = document.getElementById('exportBtn');

const playBtn = document.getElementById('playBtn');
const stepBackBtn = document.getElementById('stepBackBtn');
const stepFwdBtn = document.getElementById('stepFwdBtn');
const seek = document.getElementById('seek');
const timeLabel = document.getElementById('timeLabel');

const scaleRange = document.getElementById('scaleRange');
const angleRange = document.getElementById('angleRange');
const scaleVal = document.getElementById('scaleVal');
const angleVal = document.getElementById('angleVal');
const addKeyframeBtn = document.getElementById('addKeyframeBtn');
const keyframeListEl = document.getElementById('keyframeList');

// Ejes del óvalo relativos a `scale` (distancia interocular normalizada por
// ancho de imagen) — misma proporción que ya usa track_face.py/compose_preview.py,
// para que el óvalo se vea consistente entre esta herramienta y el resto del pipeline.
const AXIS_RATIO_X = 1.1;
const AXIS_RATIO_Y = 1.5;
const SNAP_EPSILON = 0.05; // segundos: qué tan cerca de un keyframe existente cuenta como "editándolo"

let videoFilename = '';
let keyframes = []; // {t, cx, cy, angle(rad), scale}
let draft = { cx: 0.5, cy: 0.5, angle: 0, scale: 0.12 };
let loaded = false;

function fmtTime(t) {
  return t.toFixed(2) + 's';
}

function nearestKeyframe(t) {
  let best = null, bestDist = Infinity;
  for (const k of keyframes) {
    const d = Math.abs(k.t - t);
    if (d < bestDist) { bestDist = d; best = k; }
  }
  return bestDist <= SNAP_EPSILON ? best : null;
}

// Interpola cx/cy/angle/scale entre los dos keyframes más cercanos a t,
// sosteniendo el primero/último fuera de rango (clamp) — misma lógica que
// va a usar el compositor real (FaceSwapOverlay) y la que ya usa
// compose_preview.py para probar esto offline.
function interpolate(t) {
  if (keyframes.length === 0) return null;
  if (t <= keyframes[0].t) return keyframes[0];
  if (t >= keyframes[keyframes.length - 1].t) return keyframes[keyframes.length - 1];
  for (let i = 0; i < keyframes.length - 1; i++) {
    const a = keyframes[i], b = keyframes[i + 1];
    if (t >= a.t && t <= b.t) {
      const f = (t - a.t) / (b.t - a.t || 1);
      let da = b.angle - a.angle;
      if (da > Math.PI) da -= 2 * Math.PI;
      if (da < -Math.PI) da += 2 * Math.PI;
      return {
        t, cx: a.cx + (b.cx - a.cx) * f, cy: a.cy + (b.cy - a.cy) * f,
        angle: a.angle + da * f, scale: a.scale + (b.scale - a.scale) * f,
      };
    }
  }
  return keyframes[keyframes.length - 1];
}

function drawOval(transform, color, dashed) {
  const w = canvas.width, h = canvas.height;
  ctx.save();
  ctx.translate(transform.cx * w, transform.cy * h);
  ctx.rotate(transform.angle);
  ctx.beginPath();
  ctx.ellipse(0, 0, transform.scale * w * AXIS_RATIO_X, transform.scale * w * AXIS_RATIO_Y, 0, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  if (dashed) ctx.setLineDash([8, 6]);
  ctx.stroke();
  ctx.restore();
}

function draw() {
  if (!loaded) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const interp = interpolate(video.currentTime);
  if (interp) drawOval(interp, '#4ADE80', true);
  drawOval(draft, '#8B5CF6', false);
}

function syncSlidersFromDraft() {
  scaleRange.value = draft.scale;
  angleRange.value = Math.round(draft.angle * 180 / Math.PI);
  scaleVal.textContent = draft.scale.toFixed(3);
  angleVal.textContent = Math.round(draft.angle * 180 / Math.PI) + '°';
}

function onTimeChange() {
  seek.value = video.duration ? video.currentTime / video.duration : 0;
  timeLabel.textContent = `${fmtTime(video.currentTime)} / ${fmtTime(video.duration || 0)}`;
  const near = nearestKeyframe(video.currentTime);
  renderKeyframeList(near);
  if (near) {
    draft = { cx: near.cx, cy: near.cy, angle: near.angle, scale: near.scale };
    syncSlidersFromDraft();
  }
  draw();
}

function renderKeyframeList(activeKf) {
  if (keyframes.length === 0) {
    keyframeListEl.innerHTML = '<div class="kf-empty">Todavía no hay ninguno.</div>';
    return;
  }
  keyframeListEl.innerHTML = '';
  keyframes.forEach((k, i) => {
    const row = document.createElement('div');
    row.className = 'kf-row' + (k === activeKf ? ' active' : '');
    row.innerHTML = `<span class="t">#${i + 1} · ${fmtTime(k.t)}</span><button data-i="${i}">✕</button>`;
    row.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      video.currentTime = k.t;
    });
    row.querySelector('button').addEventListener('click', (e) => {
      e.stopPropagation();
      keyframes.splice(i, 1);
      onTimeChange();
    });
    keyframeListEl.appendChild(row);
  });
}

function upsertKeyframeAtCurrentTime() {
  const t = video.currentTime;
  const near = nearestKeyframe(t);
  if (near) {
    near.cx = draft.cx; near.cy = draft.cy; near.angle = draft.angle; near.scale = draft.scale;
  } else {
    keyframes.push({ t, cx: draft.cx, cy: draft.cy, angle: draft.angle, scale: draft.scale });
    keyframes.sort((a, b) => a.t - b.t);
  }
  status.textContent = `Keyframe en ${fmtTime(t)} guardado.`;
  onTimeChange();
}

function canvasNormalizedCoords(evt) {
  const rect = canvas.getBoundingClientRect();
  return { x: (evt.clientX - rect.left) / rect.width, y: (evt.clientY - rect.top) / rect.height };
}

canvas.addEventListener('mousedown', (evt) => {
  const { x, y } = canvasNormalizedCoords(evt);
  draft.cx = Math.min(1, Math.max(0, x));
  draft.cy = Math.min(1, Math.max(0, y));
  draw();
});

scaleRange.addEventListener('input', () => {
  draft.scale = Number(scaleRange.value);
  scaleVal.textContent = draft.scale.toFixed(3);
  draw();
});
angleRange.addEventListener('input', () => {
  draft.angle = Number(angleRange.value) * Math.PI / 180;
  angleVal.textContent = angleRange.value + '°';
  draw();
});
addKeyframeBtn.addEventListener('click', upsertKeyframeAtCurrentTime);

playBtn.addEventListener('click', () => {
  if (video.paused) { video.play(); } else { video.pause(); }
});
video.addEventListener('play', () => { playBtn.textContent = '⏸'; });
video.addEventListener('pause', () => { playBtn.textContent = '▶'; });
video.addEventListener('timeupdate', onTimeChange);

function stepFrame(dir) {
  const dt = 1 / (Number(fpsInput.value) || 30);
  video.currentTime = Math.min(video.duration, Math.max(0, video.currentTime + dir * dt));
}
stepBackBtn.addEventListener('click', () => stepFrame(-1));
stepFwdBtn.addEventListener('click', () => stepFrame(1));
seek.addEventListener('input', () => {
  if (video.duration) video.currentTime = Number(seek.value) * video.duration;
});

videoFileInput.addEventListener('change', () => {
  const file = videoFileInput.files[0];
  if (!file) return;
  videoFilename = file.name;
  video.src = URL.createObjectURL(file);
});

video.addEventListener('loadedmetadata', () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  emptyHint.style.display = 'none';
  stageInner.style.display = 'block';
  loaded = true;
  [playBtn, stepBackBtn, stepFwdBtn, seek, scaleRange, angleRange, addKeyframeBtn, exportBtn].forEach(el => el.disabled = false);
  status.textContent = `${video.videoWidth}×${video.videoHeight}, ${video.duration.toFixed(2)}s`;
  syncSlidersFromDraft();
  onTimeChange();
});

exportBtn.addEventListener('click', () => {
  if (keyframes.length === 0) {
    status.textContent = 'Agregá al menos un keyframe antes de exportar.';
    return;
  }
  const data = {
    video: videoFilename || null,
    fps: Number(fpsInput.value) || 30,
    width: video.videoWidth,
    height: video.videoHeight,
    frames: keyframes.map(k => ({ t: k.t, cx: k.cx, cy: k.cy, angle: k.angle, scale: k.scale })),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'transform.json';
  a.click();
  status.textContent = `Exportado con ${keyframes.length} keyframes.`;
});

jsonFileInput.addEventListener('change', () => {
  const file = jsonFileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.frames)) throw new Error('sin campo frames[]');
      keyframes = data.frames.map(f => ({ t: f.t, cx: f.cx, cy: f.cy, angle: f.angle, scale: f.scale }))
        .filter(k => k.cx !== null && k.cx !== undefined)
        .sort((a, b) => a.t - b.t);
      if (data.fps) fpsInput.value = data.fps;
      status.textContent = `Cargados ${keyframes.length} keyframes de ${file.name}.`;
      onTimeChange();
    } catch (err) {
      status.textContent = 'No se pudo leer ese JSON: ' + err.message;
    }
  };
  reader.readAsText(file);
});
</script>
</body>
</html>
