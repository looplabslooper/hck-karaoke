[project]
name = "kiosco-sync-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "whisperx>=3.4.5",
    "demucs>=4.0.1",
    # opencv/mediapipe también los usa track_color.py (sticker por color) —
    # ese tracking corre bien en CPU, no es exclusivo de face swap, por eso
    # quedan acá y no en el extra "faceswap" de abajo.
    "opencv-python>=5.0.0.93",
    "mediapipe>=1.0.0",
]

# Face swap ("Cara en el escenario" con IA real, no el sticker por color) es
# la única pieza del pipeline que de verdad *necesita* GPU NVIDIA para ser
# viable — probado: un clip de 48 cuadros no termina ni después de 13 minutos
# en CPU (ver gotcha en CLAUDE.md). Separado como extra para que una PC sin
# GPU no baje estos ~1GB+ de dependencias CUDA-específicas sin poder usarlos
# nunca — `uv sync` (sin extra) alcanza para sincronía de letra (WhisperX,
# anda en CPU aunque más lento) y para el sticker por color. Instalación
# completa: `uv sync --extra faceswap`.
[project.optional-dependencies]
faceswap = [
    "insightface>=0.7.3",
    # Pineado a 1.22.0 (no ">=") a propósito: es la última serie que todavía
    # pide sus dependencias CUDA como "nvidia-*-cu12" (ver extras [cuda,cudnn]
    # abajo) — misma versión de CUDA que ya usa torch (cu124) arriba. Desde
    # 1.23+ onnxruntime-gpu pasó a pedir CUDA 13 ("nvidia-*-cu13"), que a la
    # fecha de escribir esto no tiene wheels de Windows para nvidia-cublas —
    # no actualizar sin volver a chequear que exista esa wheel.
    "onnxruntime-gpu[cuda,cudnn]==1.22.0",
    # No viene incluido en los extras de onnxruntime-gpu de arriba (falta
    # cublas ahí, solo trae cudnn/cufft/curand/nvrtc/runtime) pero inswapper
    # lo necesita igual — ver pipeline/_cuda_dlls.py para el porqué hace
    # falta este paquete Y un fix de PATH en tiempo de ejecución.
    "nvidia-cublas-cu12",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
